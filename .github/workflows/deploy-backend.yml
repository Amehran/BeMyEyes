name: Deploy Backend to Cloud Run

on:
  push:
    branches:
      - main
      - feature/gcp-cloud-run-deploy
      - Mission-Driven-Agentic-System # Enable CI/CD on this branch
      - dev # Enable CI/CD on dev branch
    paths:
      - 'backend/**'
      - 'Dockerfile'
      - '.github/workflows/deploy-backend.yml'

env:
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }} # Secret: Your Google Cloud Project ID
  REGION: us-central1 # Change if needed
  SERVICE_NAME: bemyeyes-backend
  REPO_NAME: bemyeyes # Artifact Registry Repo Name

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: 'read'
      id-token: 'write'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Log in to Google Cloud (Workload Identity Federation is safer than keys, but JSON key is easier for quick start)
      # For this setup, we will assume you add a SERVICE_ACCOUNT_KEY secret (JSON)
      - name: 'Authenticate to Google Cloud'
        uses: 'google-github-actions/auth@v2'
        with:
          credentials_json: '${{ secrets.GCP_SA_KEY }}'

      - name: 'Set up Cloud SDK'
        uses: 'google-github-actions/setup-gcloud@v2'

      - name: 'Configure Docker'
        run: |
          gcloud auth configure-docker ${REGION}-docker.pkg.dev

      - name: 'Build and Push Container'
        run: |
          image_tag="${REGION}-docker.pkg.dev/${PROJECT_ID}/${REPO_NAME}/${SERVICE_NAME}:${GITHUB_SHA}"
          echo "Building image: $image_tag"
          docker build -t "${image_tag}" .
          docker push "${image_tag}"

      - name: 'Deploy to Cloud Run'
        uses: 'google-github-actions/deploy-cloudrun@v2'
        with:
          service: '${{ env.SERVICE_NAME }}'
          region: '${{ env.REGION }}'
          image: '${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPO_NAME }}/${{ env.SERVICE_NAME }}:${{ github.sha }}'
          # Allow unauthenticated invocations (public API). Remove for internal-only.
          flags: '--allow-unauthenticated'
          env_vars: |
            GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}
